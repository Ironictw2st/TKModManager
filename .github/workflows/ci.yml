name: CI

# Compile + typecheck + tests on every push to master and on PRs.
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Typecheck + frontend bundle (the Rust build embeds ../dist).
      - run: npm run build
      - run: npm test

      - name: Cargo build
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked

      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
