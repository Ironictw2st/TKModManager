name: CI

# Tests for the GUI-free core on every push to master and on PRs. The Qt app (crates/app) needs
# the local KDE Craft Qt and the ritual-generated bindings, so it is built and released from the
# maintainer's PC with scripts/release.ps1.
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The app's path dependencies (ritual Qt bindings) only exist locally: drop it from the
      # workspace so Cargo doesn't try to resolve them.
      - name: Core-only workspace
        shell: pwsh
        run: (Get-Content Cargo.toml) -replace '"crates/app"', '' | Set-Content Cargo.toml

      - name: Test tkmm_core
        run: cargo test -p tkmm_core
