name: Release

# Publishes a portable Windows exe as a GitHub Release. Trigger: bump "version" in package.json
# and push to master (the v<version> tag is created for you), or push a v* tag. A run whose
# version already has a release is a no-op. Installed copies self-update from the latest release.
on:
  push:
    branches: [master]
    tags:
      - "v*"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and look for an existing release
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver="$(grep -m1 '"version"' package.json | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')"
          fi
          tag="v$ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists - nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Will build and publish $tag."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # `tauri build` runs the frontend build and embeds it (prod mode). --no-bundle skips the
      # NSIS/MSI installers; we only ship the portable exe.
      - run: npx tauri build --no-bundle

      - run: cp src-tauri/target/release/tk-mod-manager.exe TKModManager-x64.exe

      - name: Extract release notes
        shell: bash
        run: |
          ver="${{ needs.gate.outputs.version }}"
          awk -v v="## [$ver]" '
            index($0, v)==1 {f=1; next}
            /^## \[/ {if(f) exit}
            f {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then echo "TK Mod Manager ${{ needs.gate.outputs.tag }}." > RELEASE_NOTES.md; fi
          echo "----- release notes -----"; cat RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.gate.outputs.tag }}
          name: "TK Mod Manager ${{ needs.gate.outputs.tag }}"
          body_path: RELEASE_NOTES.md
          files: TKModManager-x64.exe
