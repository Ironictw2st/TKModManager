[package]
name = "tk-mod-manager"
version = "0.3.1"
description = "Mod manager and launcher for Total War: THREE KINGDOMS"
authors = ["Ironictw2st"]
edition = "2021"
rust-version = "1.77"

# Standalone workspace root (keeps cargo from adopting any parent workspace).
[workspace]

[lib]
name = "tk_mod_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
# Desktop shortcuts (.lnk) for "play this profile".
mslnk = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# Per-user data directory (%APPDATA%\TKModManager).
directories = "6"
# Read Total War `.pack` archives (headers + file indexes, lazily) for pack typing and conflicts.
rpfm_lib = "4.7"
# Downloads (DLL releases, app updates, Steam metadata).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# Portable self-replacing app updater.
self-replace = "1"
semver = "1"
sha2 = "0.10"
hex = "0.4"
# Process spawn / window wait / DLL injection primitives shared with the script extender.
inject_core = { git = "https://github.com/Ironictw2st/TK-ScriptExtender", tag = "v0.17.0" }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
incremental = true
