[package]
name = "tkmm_inject"
description = "TK Mod Manager: loads the script extender into the running game"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "tkmm-inject"
path = "src/main.rs"

[dependencies]
serde_json = "1"
inject_core = { git = "https://github.com/Ironictw2st/TK-ScriptExtender", tag = "v0.17.0" }

[build-dependencies]
winres = "0.1"
