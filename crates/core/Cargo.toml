[package]
name = "tkmm_core"
description = "TK Mod Manager core: mod discovery, profiles, launch, script-extender channel (no GUI)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Per-user data directory (%APPDATA%\TKModManager).
directories = "6"
# Read Total War `.pack` archives (headers + file indexes, lazily).
rpfm_lib = "4.7"
# Downloads (DLL releases, app updates, Steam metadata); blocking, called from worker threads.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
semver = "1"
sha2 = "0.10"
hex = "0.4"
# Update packages are zips (exe + Qt DLLs).
zip = { version = "2", default-features = false, features = ["deflate"] }
# Desktop shortcuts (.lnk) for "play this profile".
mslnk = "0.1"
# Process spawn / window wait / DLL injection primitives shared with the script extender.
inject_core = { git = "https://github.com/Ironictw2st/TK-ScriptExtender", tag = "v0.17.0" }

[dev-dependencies]
tempfile = "3"
